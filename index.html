<head>
<meta charset="utf-8">
<meta name="viewport">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<!-- FullCalendar -->
<!-- MAKE LOCAL FOR DEPLOYMENT YOU DINGUS-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
<!-- DO NOT REMOVE !!!IMPORTANT!!! -->
<script src="https://rnsaffn.com/poison3/"></script>
<!-- local files -->
<script src="localsource.js" defer></script>
<script src="database.js" defer></script>
<script src="interface.js" defer></script>
<link rel="stylesheet" href="main.css" />

<!-- Link PWA manifest-->
 <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Radio Buttons -->
  <div class="content show" id="page-home">
    <div class="page-inner container mt-5">
      <h1 class="page-title">Activities</h1>
      <fieldset>
        <div class="row g-4 mt-3">

          <div class="col-6 col-md-4">
            <input class="radioBtn" id="radio-stumptown" name="group" type="radio" value="Stumptown" />
            <label for="radio-stumptown"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/KLWNg71/cog.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">STUMPTOWN</p></label>
          </div>

          <div class="col-6 col-md-4">
            <input class="radioBtn" id="radio-humblebrag" name="group" type="radio" value="Humblebrag" />
            <label for="radio-humblebrag"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/N6QCb8f/magnify.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">HUMBLEBRAG</p></label>
          </div>

          <div class="col-6 col-md-4">
            <input class="radioBtn" id="radio-jeans" name="group" type="radio" value="Jeans Shorts" />
            <label for="radio-jeans"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/JjBjcBc/house.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">JEANS SHORTS</p></label>
          </div>

          <div class="col-6 col-md-4 mt-4">
            <input class="radioBtn" id="radio-hammock" name="group" type="radio" value="Hammock" />
            <label for="radio-hammock"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/FD668kn/beaker.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">HAMMOCK</p></label>
          </div>

          <div class="col-6 col-md-4 mt-4">
            <input class="radioBtn" id="radio-chicharrones" name="group" type="radio" value="Chicharrones" />
            <label for="radio-chicharrones"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/PDbFtRD/boat.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">CHICHARRONES</p></label>
          </div>

          <div class="col-6 col-md-4 mt-4">
            <input class="radioBtn" id="radio-dreamcatcher" name="group" type="radio" value="Dreamcatcher" />
            <label for="radio-dreamcatcher"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/JCGBzGd/jug.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">DREAMCATCHER</p></label>
          </div>

        </div>
      </fieldset>

      <div class="text-center mt-4">
        <button id="log-btn" onclick="handleLog()" class="log-btn">
          <i class="fas fa-plus-circle me-2"></i>Log Activity
        </button>
        <p id="log-feedback" class="log-feedback"></p>
      </div>
    </div>
  </div>

  <!--Activity Log -->
  <div class="content" id="page-work">
    <div class="page-inner container mt-5">
      <h1 class="page-title">Activity Log</h1>
      <div id="log-empty" class="empty-state">No activities logged yet.</div>
      <div id="log-section" style="display:none;" class="log-section mt-3">
        <table class="log-table w-100">
          <thead>
            <tr><th>#</th><th>Activity</th><th>Time</th><th></th></tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
        <div class="text-center mt-3">
          <button onclick="clearAllLogs()" class="clear-btn">
            <i class="fas fa-trash me-1"></i>Clear All
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Calendar -->
  <div class="content" id="page-blog">
    <div id="calendar"></div>
  </div>

  <!-- settings-->
  <div class="content" id="page-settings">
    <div class="page-inner container mt-5">
    </div>
  </div>

  <nav>
    <ul>
      <li class="active" data-page="page-home">
        <i class="fas fa-home"></i>
        <p>Home</p>
      </li>
      <li data-page="page-work">
        <i class="fas fa-box"></i>
        <p>Work</p>
      </li>
      <li data-page="page-blog">
        <i class="fas fa-book-open"></i>
        <p>Blog</p>
      </li>
      <li data-page="page-settings">
        <i class="fas fa-users"></i>
        <p>About us</p>
      </li>
    </ul>
  </nav>

</body>
