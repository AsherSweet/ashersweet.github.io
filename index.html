<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="interface.js"></script>
<script src="database.js"></script>
<link rel="stylesheet" href="main.css" />
</head>
<body>
<div class="container mt-5">
	<div class="col-lg-8 offset-lg-2">
		<p class="fs-3 fw-light">Radio Buttons</p>

	<fieldset>

		<div class="row g-4 mt-3">

			<div class="col-6 col-md-4">
			  <input class="radioBtn" id="radio-stumptown" name="group" type="radio" value="Stumptown" />
			  <label for="radio-stumptown"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/KLWNg71/cog.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">STUMPTOWN</p></label>
			</div>

			<div class="col-6 col-md-4">
			  <input class="radioBtn" id="radio-humblebrag" name="group" type="radio" value="Humblebrag" />
			  <label for="radio-humblebrag"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/N6QCb8f/magnify.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">HUMBLEBRAG</p></label>
			</div>

			<div class="col-6 col-md-4">
			  <input class="radioBtn" id="radio-jeans" name="group" type="radio" value="Jeans Shorts" />
			  <label for="radio-jeans"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/JjBjcBc/house.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">JEANS SHORTS</p></label>
			</div>

			<div class="col-6 col-md-4 mt-4">
			  <input class="radioBtn" id="radio-hammock" name="group" type="radio" value="Hammock" />
			  <label for="radio-hammock"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/FD668kn/beaker.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">HAMMOCK</p></label>
			</div>

			<div class="col-6 col-md-4 mt-4">
			  <input class="radioBtn" id="radio-chicharrones" name="group" type="radio" value="Chicharrones" />
			  <label for="radio-chicharrones"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/PDbFtRD/boat.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">CHICHARRONES</p></label>
			</div>

			<div class="col-6 col-md-4 mt-4">
			  <input class="radioBtn" id="radio-dreamcatcher" name="group" type="radio" value="Dreamcatcher" />
			  <label for="radio-dreamcatcher"><div class="toggle-icon fa fa-check"></div><img src="https://i.ibb.co/JCGBzGd/jug.png" class="img-fluid my-2 ml-23 mh-55" border="0"><p class="mb-2">DREAMCATCHER</p></label>
			</div>

		</div>

	</fieldset>

	<fieldset>

		<div class="row g-4 mt-0">

			<div class="col-6">
			  <input class="radioBtn" id="radio-yes" name="question" type="radio" value="yes" />
			  <label for="radio-yes" class="radio-pad"><div class="toggle-icon fa fa-check"></div><p class="my-1 ml-23">YES</p></label>
			</div>

			<div class="col-6">
			  <input class="radioBtn" id="radio-no" name="question" type="radio" value="No" />
			  <label for="radio-no" class="radio-pad"><div class="toggle-icon fa fa-check"></div><p class="my-1 ml-23">NO</p></label>
			</div>

		</div>

	</fieldset>

	<p class="fs-3 fw-light mt-5">Checkboxes</p>

	<fieldset>

		<div class="row g-4 mt-3">
	
			<div class="col-md-4">
			  <input class="radioBtn" id="check-html" name="check" type="checkbox" value="HTML" />
			  <label for="check-html" class="radio-pad"><div class="toggle-icon fa fa-check"></div><p class="my-1 ml-23">HTML</p></label>
			</div>

			<div class="col-md-4">
			  <input class="radioBtn" id="check-css" name="check" type="checkbox" value="CSS" />
			  <label for="check-css" class="radio-pad"><div class="toggle-icon fa fa-check"></div><p class="my-1 ml-23">CSS</p></label>
			</div>

			<div class="col-md-4">
			  <input class="radioBtn" id="check-js" name="check" type="checkbox" value="JS" />
			  <label for="check-js" class="radio-pad"><div class="toggle-icon fa fa-check"></div><p class="my-1 ml-23">JS</p></label>
			</div>

		</div>

	</fieldset>

	<fieldset>

		<div class="row g-4 mt-0">

			<div class="col-md-12">
			  <input class="radioBtn" id="check-vs" name="check" type="checkbox" value="Vegan Squid" />
			  	<label for="check-vs">
			  		<div class="toggle-icon fa fa-check"></div>
			  			<div class="d-flex flex-column flex-sm-row py-3 ml-23">
			  				<img src="https://i.ibb.co/brg9ggw/quote.png" class="img-fluid my-auto mx-auto mh-44" border="0">
			  			<div class="flex-grow-1 text-center text-sm-start my-auto mx-4">
			  				<h5 class="pt-2 pt-sm-0">Vegan Squid</h5>
			  				<p class="mb-0">Messenger bag mumblecore gluten-free keffiyeh aesthetic flexitarian actually direct trade.</p>
			  			</div>
			  			<div class="text-center my-auto">
			  				<p class="mb-0 pt-2 pt-sm-0">From</p>
			  					<div class="number">
			  						<sup>$</sup>25.99
			  					</div>
			  						<p class="mb-0">per month</p>
			  			</div>
			  			</div> <!-- d-flex -->
			  	</label>
		  	</div>

  		</div>

		<div class="row g-4 mt-0">

			<div class="col-md-12 mt-4">
			  <input class="radioBtn" id="check-fl" name="check" type="checkbox" value="Chic Four Loco" />
			  	<label for="check-fl">
			  		<div class="toggle-icon fa fa-check"></div>
			  			<div class="d-flex flex-column flex-sm-row py-3 ml-23">
			  				<img src="https://i.ibb.co/mtgLy41/sail.png" class="img-fluid my-auto mx-auto mh-55" border="0">
			  			<div class="flex-grow-1 text-center text-sm-start my-auto mx-4">
			  				<h5 class="pt-2 pt-sm-0">Chic Four Loko</h5>
			  				<p class="mb-0">Letterpress echo park coloring book mixtape mumblecore shabby chic banh mi williamsburg.</p>
			  			</div>
			  			<div class="text-center my-auto">
			  				<p class="mb-0 pt-2 pt-sm-0">From</p>
			  					<div class="number">
			  						<sup>$</sup>25.99
			  					</div>
			  						<p class="mb-0">per month</p>
			  			</div>
			  			</div> <!-- d-flex -->
			  	</label>
			 </div>
  		</div>

	</fieldset>

	<fieldset>

		<div class="row g-4 mt-0">
			<div class="col-md-5 offset-md-1">
			  <input class="radioBtn" id="check-pk" name="check" type="checkbox" value="Plaid Knausgaard" />
			  	<label for="check-pk">
			  		<div class="toggle-icon fa fa-check"></div>
			  			<div class="d-flex flex-column flex-sm-row flex-md-column py-3 ml-23">
			  				<img src="https://i.ibb.co/jLMg8TR/clock.png" class="img-fluid my-auto mx-auto mh-55" border="0">
			  			<div class="text-center text-sm-start text-md-center my-auto mx-1 mx-sm-3 mx-md-2">
			  				<h5 class="pt-2 pt-sm-0 pt-md-2">Plaid Knausgaard</h5>
			  				<p class="mb-0">Tumeric fashion axe truffaut try-hard flannel disrupt pinterest.</p>
			  			</div>
			  			<div class="text-center my-auto">
			  				<p class="mb-0 pt-2 pt-sm-0 pt-md-2">From</p>
			  					<div class="number">
			  						<sup>$</sup>25.99
			  					</div>
			  						<p class="mb-0">per month</p>
			  			</div>
			  			</div> <!-- d-flex -->
			  	</label>
			</div> <!-- col -->

		<div class="col-md-5 mb-5">
		  <input class="radioBtn" id="check-gj" name="check" type="checkbox" value="option-1" />
		  	<label for="check-gj">
		  		<div class="toggle-icon fa fa-check"></div>
		  			<div class="d-flex flex-column flex-sm-row flex-md-column py-3 ml-23">
		  				<img src="https://i.ibb.co/DWNtz6K/mail.png" class="img-fluid mx-auto mh-55" border="0">
		  			<div class="text-center text-sm-start text-md-center mx-1 mx-sm-3 mx-md-2">
		  				<h5 class="pt-2 pt-sm-0 pt-md-2">Green Juice</h5>
		  				<p class="mb-0">Shabby chic chambray everyday carry raclette poutine.</p>
		  			</div>
		  			<div class="text-center">
		  				<p class="mb-0 pt-2 pt-sm-0 pt-md-2">From</p>
		  					<div class="number">
		  						<sup>$</sup>25.99
		  					</div>
		  						<p class="mb-0">per month</p>
		  			</div>
		  			</div> <!-- d-flex -->
		  	</label>
		</div> <!-- col -->

	</div> <!-- row -->

	</fieldset>

	</div>
</div>
  <div class="phone-screen">
    <nav>
      <ul>
        <li>
          <i class="fas fa-home"></i>
          <p>Home</p>
        </li>
        <li>
          <i class="fas fa-box"></i>
          <p>Work</p>
        </li>
        <li>
          <i class="fas fa-book-open"></i>
          <p>Blog</p>
        </li>
        <li>
          <i class="fas fa-users"></i>
          <p>About us</p>
        </li>
      </ul>
    </nav>
  </div>

    
</body>
